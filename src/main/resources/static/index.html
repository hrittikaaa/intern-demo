<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-top: 30px; }

    form { display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
    input {
      padding: 6px 10px;
      font-size: 0.95rem;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    button {
      padding: 7px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover { background: #555; }

    #message { margin-top: 8px; font-size: 0.9rem; color: green; }
    #message.error { color: red; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 7px 10px;
      border: 1px solid #ddd;
    }
    th { background: #f0f0f0; }
    tr:nth-child(even) { background: #fafafa; }

    #no-users { color: #888; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>User Management</h1>

  <!-- Add User Form -->
  <h2>Add User</h2>
  <form id="userForm">
    <input type="text"  id="name"  placeholder="Name"  required />
    <input type="email" id="email" placeholder="Email" required />
    <button type="submit">Add User</button>
  </form>
  <p id="message"></p>

  <!-- User List -->
  <h2>All Users</h2>
  <div id="no-users" style="display:none;">No users found.</div>
  <table id="userTable" style="display:none;">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody id="userBody"></tbody>
  </table>

  <script>
    const form    = document.getElementById('userForm');
    const message = document.getElementById('message');
    const table   = document.getElementById('userTable');
    const noUsers = document.getElementById('no-users');
    const tbody   = document.getElementById('userBody');

    // Load users on page load
    loadUsers();

    // Handle form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name  = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      try {
        const res = await fetch('/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });

        if (!res.ok) throw new Error('Failed to add user');

        message.className = '';
        message.textContent = 'User added successfully!';
        form.reset();
        loadUsers();
      } catch (err) {
        message.className = 'error';
        message.textContent = 'Error: ' + err.message;
      }
    });

    async function loadUsers() {
      try {
        const res   = await fetch('/users');
        const users = await res.json();

        tbody.innerHTML = '';

        if (users.length === 0) {
          table.style.display   = 'none';
          noUsers.style.display = 'block';
        } else {
          noUsers.style.display = 'none';
          table.style.display   = 'table';
          users.forEach(u => {
            const row = `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td></tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
          });
        }
      } catch (err) {
        noUsers.style.display = 'block';
        noUsers.textContent   = 'Could not load users.';
      }
    }
  </script>

</body>
</html>
